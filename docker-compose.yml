# Variables que exige `storage.settings.Settings` (las usan `app` y `copilot`).
x-pipeline-env: &pipeline-env
  DATABASE_URL: "mysql+pymysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/image_repo"
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
  MINIO_BUCKET: image-annotations
  DATASET_DIR: /app/data/raw
  REPORTS_DIR: /app/reports
  # OPS-03: contrato con el worker (OPS-04) y el entrenamiento (ML-04). Los
  # artefactos se suben a través del servidor, sin credenciales de MinIO.
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # MLflow 3 descargaría directo de MinIO con URLs prefirmadas; se fuerza el paso
  # por el servidor (ver app/tracking/client.py).
  MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
  MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: image_repo
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Issue #36: quay.io/minio/minio y minio/minio ya no se pueden descargar sin
    # autenticación. Esta es la build pública de Chainguard (misma CLI). Solo
    # publica `latest`. Lee los volúmenes `minio_data` creados con la imagen
    # anterior; respaldo opcional en "Cambio de imagen de MinIO (issue #36)" del README.
    image: cgr.dev/chainguard/minio:latest
    # Corre como 65532 por defecto: no podría escribir ni un volumen nuevo en /data
    # ni los existentes, que creó como root la imagen anterior.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # OPS-03: MLflow Tracking Server persistente. Runs/métricas en la base `mlflow`
  # de MariaDB y artefactos en el bucket `mlflow` de MinIO: sobreviven a
  # `docker compose down` (sin -v). Ver mlflow-server/README.md.
  mlflow:
    build: ./mlflow-server
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MLFLOW_BACKEND_STORE_URI: "mysql+pymysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/mlflow"
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
      # MLflow 3 rechaza Host headers que no sean localhost/IP privada; `mlflow`
      # es como lo llaman los demás contenedores.
      MLFLOW_ALLOWED_HOSTS: "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      # Solo loopback: la UI no tiene autenticación.
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: on-failure:5

  backend:
    build: ./backend
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: "mysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/image_repo"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      DB_NAME: image_repo
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET: image-annotations
      MAX_UPLOAD_SIZE_BYTES: 5242880
      PIPELINE_CONFIG_ROOT: /pipeline
    volumes:
      - ./app/policies:/pipeline/policies
      - ./app/splits:/pipeline/splits
    ports:
      - "3100:3100"
    restart: on-failure:5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
      - copilot
    ports:
      - "8080:80"
    volumes:
      # P2-22/23/24: el gate (servicio `app`) escribe reportes acá; nginx
      # los sirve como estático en /reports/*.json, sin backend HTTP nuevo.
      - ./reports:/usr/share/nginx/html/reports:ro

  app:
    build: ./app
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment: *pipeline-env
    volumes:
      # Dataset real (anotaciones + imágenes), de solo lectura: el gate no
      # escribe ahí, solo lee. El pipeline Python nunca gestionó data/raw/
      # como parte de su propia imagen (ver app/Dockerfile).
      - ./data/raw:/app/data/raw:ro
      - ./reports:/app/reports
      - ./app/policies:/app/policies:ro
      - ./app/splits:/app/splits:ro
    restart: on-failure:5

  # P2-52: agente del Copilot (LLM + herramientas MCP de solo lectura). Misma
  # imagen que `app`, otro comando. No se publica ningún puerto: solo nginx
  # (servicio `frontend`) lo alcanza, en /copilot-api/. Sin ANTHROPIC_API_KEY
  # arranca igual y el chat responde 503 explicando qué falta.
  copilot:
    build: ./app
    command: ["python", "-m", "copilot.server"]
    environment:
      <<: *pipeline-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-claude-opus-5}
      COPILOT_HOST: 0.0.0.0
    volumes:
      # Solo lectura: el Copilot consulta el dataset y los reportes, nunca escribe.
      - ./data/raw:/app/data/raw:ro
      - ./reports:/app/reports:ro
    restart: on-failure:5

volumes:
  mariadb_data:
  minio_data:
