server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # APP-03: API de jobs de entrenamiento (servicio Python `ml-api`). nginx elige el
    # prefijo más largo, así que /api/ml/* llega aquí y no al backend de Node.
    location /api/ml/ {
        # APP-07/09: Inference acepta imágenes de hasta 10 MB (MAX_UPLOAD_BYTES); el 1 MB
        # por defecto de nginx las cortaba con un 413 en HTML antes de llegar a ml-api.
        client_max_body_size 11m;
        proxy_pass http://ml-api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:3100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # APP-08/09: "Enviar a cola de anotación" (POST /api/images/from-inference) manda
        # la imagen que Inference aceptó (hasta 10 MiB) más el campo metadata; con 10m
        # nginx cortaba con un 413 en HTML una imagen de exactamente 10 MiB. El backend
        # sigue limitando el archivo a MAX_UPLOAD_SIZE_BYTES.
        client_max_body_size 11m;
    }

    # P2-52: agente del Copilot. Una respuesta puede encadenar varias rondas de
    # herramientas y llamadas al modelo, así que el timeout de lectura es mayor
    # que el default de nginx (60 s).
    location /copilot-api/ {
        proxy_pass http://copilot:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    # P2-22/23/24: reportes del gate (volumen compartido, ver docker-compose.yml).
    # Sin esto, el fallback de SPA de abajo convierte un reporte que todavía
    # no existe (p. ej. splits.json) en un 200 con index.html en vez de un
    # 404 real, y el frontend no puede distinguir "no existe" de "cargó mal".
    location /reports/ {
        disable_symlinks on;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
